name: Images

# Publishes ready-to-run images to Docker Hub:
#   impa365/impameet-{platform,agent,screen}
# main -> :latest and :sha-<commit>    tag v1.2.3 -> :1.2.3, :1.2 and :1
#
# Repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with
# Read & Write permission, created at https://app.docker.com/settings/personal-access-tokens).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: impa365

jobs:
  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [platform, agent, screen]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.NAMESPACE }}/impameet-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=IMPA Meet ${{ matrix.app }}
            org.opencontainers.image.vendor=Impa 365
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://impa365.com
      - name: Tests (test stage)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: test
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Vulnerability scan (report)
        env:
          IMAGE: docker.io/${{ env.NAMESPACE }}/impameet-${{ matrix.app }}:sha-${{ github.sha }}
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.76.2 image --quiet --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output "/out/trivy-${{ matrix.app }}.sarif" "$IMAGE"
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.app)) != ''
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}
        continue-on-error: true
