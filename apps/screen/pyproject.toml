[project]
name = "meet-impar-screen"
version = "0.1.0"
description = "Optional IMPA Meet service: lets the AI agent share a screen (web page or notes) in a room."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "aiohttp==3.14.5",
    "livekit==1.2.0",
    "livekit-api==1.2.2",
    "pillow==13.0.0",
    "playwright==1.64.1",
    "pydantic>=2.9,<3",
]

[project.scripts]
meet-impar-screen = "meet_impar_screen.server:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meet_impar_screen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["meet_impar_screen"]

[[tool.mypy.overrides]]
module = ["livekit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=meet_impar_screen --cov-report=term-missing"
markers = ["browser: drives a real headless Chromium (skipped when it is not installed)"]

[tool.coverage.run]
branch = true
source = ["meet_impar_screen"]

[tool.bandit]
exclude_dirs = ["tests"]
